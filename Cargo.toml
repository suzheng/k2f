[workspace]
resolver = "2"
members = [
    "engine/k2f_core",
    "engine/k2f_text",
    "engine/k2f_math",
    "engine/k2f_layout",
    "engine/k2f_package",
    "engine/k2f_markdown",
    "engine/k2f_paint",
    "engine/k2f_pdf",
    "engine/k2f_sdk",
    "engine/k2f_py",
    "engine/k2f_wasm",
    "engine/k2f_mcp",
    "cli/k2f_cli",
    "tests/runner",
    "desktop/k2f_reader",
    "export/k2f_pptx",
    "export/k2f_docx",
]
default-members = [
    "engine/k2f_core",
    "engine/k2f_text",
    "engine/k2f_math",
    "engine/k2f_layout",
    "engine/k2f_package",
    "engine/k2f_markdown",
    "engine/k2f_paint",
    "engine/k2f_pdf",
    "engine/k2f_sdk",
    "engine/k2f_wasm",
    "cli/k2f_cli",
    "tests/runner",
]

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["unbounded_depth"] }
thiserror = "1.0"
k2f_core = { path = "engine/k2f_core", version = "0.2.4" }
k2f_text = { path = "engine/k2f_text", version = "0.2.4" }
k2f_math = { path = "engine/k2f_math", version = "0.2.4" }
k2f_layout = { path = "engine/k2f_layout", version = "0.2.4" }
k2f_package = { path = "engine/k2f_package", version = "0.2.4" }
k2f_markdown = { path = "engine/k2f_markdown", version = "0.2.4" }
k2f_paint = { path = "engine/k2f_paint", version = "0.2.4" }
k2f_pdf = { path = "engine/k2f_pdf", version = "0.2.4" }
k2f_sdk = { path = "engine/k2f_sdk", version = "0.2.4" }
