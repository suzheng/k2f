[package]
name = "k2f_markdown"
version = "0.2.0"
edition = "2021"
description = "K2F semantic tree to Markdown"
license = "Apache-2.0"
repository = "https://github.com/suzheng/k2f"
homepage = "https://github.com/suzheng/k2f"
documentation = "https://docs.rs/k2f_markdown"
authors = ["K2F Contributors"]
keywords = ["k2f", "markdown", "document"]
categories = ["text-processing"]

[dependencies]
k2f_core = { path = "../k2f_core", version = "0.2.0" }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
k2f_package = { path = "../k2f_package", version = "0.2.0" }
