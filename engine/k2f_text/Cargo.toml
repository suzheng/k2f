[package]
name = "k2f_text"
version = "0.2.3"
edition = "2021"
description = "K2F text shaping, bidi, and font fallback"
license = "Apache-2.0"
repository = "https://github.com/suzheng/k2f"
homepage = "https://github.com/suzheng/k2f"
documentation = "https://docs.rs/k2f_text"
authors = ["K2F Contributors"]
keywords = ["k2f", "text", "shaping", "fonts"]
categories = ["text-processing"]

[dependencies]
rustybuzz = "0.10.0"
ttf-parser = { version = "0.25.1", default-features = false, features = ["std"] }
unicode-bidi = "0.3.15"
k2f_core = { path = "../k2f_core", version = "0.2.3" }
