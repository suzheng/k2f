[package]
name = "k2f_paint"
version = "0.2.0"
edition = "2021"
description = "K2F lock paint / raster executor"
license = "Apache-2.0"
repository = "https://github.com/suzheng/k2f"
homepage = "https://github.com/suzheng/k2f"
documentation = "https://docs.rs/k2f_paint"
authors = ["K2F Contributors"]
keywords = ["k2f", "paint", "raster", "viewer"]
categories = ["rendering::engine"]

[dependencies]
k2f_core = { path = "../k2f_core", version = "0.2.0" }
k2f_markdown = { path = "../k2f_markdown", version = "0.2.0" }
k2f_package = { path = "../k2f_package", version = "0.2.0" }
thiserror = { workspace = true }
tiny-skia = "0.11.0"
ttf-parser = "0.21.1"
serde = { workspace = true }
serde_json = { workspace = true }
image = { version = "=0.25.6", default-features = false, features = ["png", "webp", "jpeg"] }
resvg = { version = "0.43.0", default-features = false }

[dev-dependencies]
k2f_layout = { path = "../k2f_layout", version = "0.2.0" }
zip = { version = "2", default-features = false, features = ["deflate"] }
