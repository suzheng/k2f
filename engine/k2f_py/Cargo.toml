[package]
name = "k2f_py"
version = "0.2.0"
edition = "2021"
description = "K2F PyO3 bindings (distributed via sdk/python)"
license = "Apache-2.0"
repository = "https://github.com/suzheng/k2f"
publish = false

[lib]
name = "k2f"
crate-type = ["cdylib"]

[dependencies]
k2f_cli = { package = "k2f", path = "../../cli/k2f_cli", version = "0.2.0" }
k2f_sdk = { path = "../k2f_sdk", version = "0.2.0" }
pyo3 = { version = "0.23", features = ["extension-module"] }
