[package]
name = "k2f_pptx"
version = "0.2.3"
edition = "2021"
description = "K2F lock → PPTX exporter"
license = "Apache-2.0"
repository = "https://github.com/suzheng/k2f"
homepage = "https://github.com/suzheng/k2f"
documentation = "https://docs.rs/k2f_pptx"
readme = "README.md"
authors = ["K2F Contributors"]
keywords = ["k2f", "pptx", "powerpoint", "export"]
categories = ["text-processing"]

[[bin]]
name = "k2f-pptx"
path = "src/main.rs"

[dependencies]
k2f_core = { path = "../../engine/k2f_core", version = "0.2.3" }
k2f_paint = { path = "../../engine/k2f_paint", version = "0.2.3" }
thiserror = "1.0"
zip = { version = "2", default-features = false, features = ["deflate"] }
clap = { version = "4", features = ["derive"] }
image = { version = "=0.25.6", default-features = false, features = ["png"] }
ttf-parser = "0.21"

[dev-dependencies]
roxmltree = "0.20"
