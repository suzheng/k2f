[package]
name = "k2f-test-runner"
version = "0.2.3"
edition = "2021"
description = "K2F golden test runner"
license = "Apache-2.0"
repository = "https://github.com/suzheng/k2f"
publish = false

[dependencies]
k2f_core = { path = "../../engine/k2f_core" }
k2f_layout = { path = "../../engine/k2f_layout" }
k2f_paint = { path = "../../engine/k2f_paint" }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { version = "1.0", features = ["backtrace"] }
clap = { version = "4.4", features = ["derive"] }
walkdir = "2.3"
colored = "2.0"
diff = "0.1"
sha2 = "0.10"
image = "0.24"
